name: macOS Music probe

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-26-intel
      track_count:
        description: Number of synthetic tracks, 2 to 128
        type: string
        default: '2'
  push:
    branches:
      - macos-probe
    paths:
      - .github/workflows/macos-music-probe.yml
      - scripts/probe_macos_music.py
      - tests/test_macos_music_probe.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test probe helpers
        run: python3 -m unittest discover -s tests -p test_macos_music_probe.py
      - name: Inspect Music with synthetic audio
        env:
          TRACK_COUNT: ${{ inputs.track_count || '2' }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess, sys
          sys.path.insert(0, 'scripts')
          from probe_macos_music import validate_track_count
          track_count = validate_track_count(int(os.environ['TRACK_COUNT']))
          subprocess.run([sys.executable, 'scripts/probe_macos_music.py', '--output', 'data/macos-probe', '--track-count', str(track_count)], check=True)
          PYTHON
      - name: Summarize diagnostic results
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path('data/macos-probe/report.json')
          if path.exists():
              report = json.loads(path.read_text())
              lines = ['## Music diagnostic', '',
                       'Diagnostic completion does not confirm Genius compatibility.', '',
                       '| Operation | Result |', '|---|---|']
              lines += [f"| {name} | {step['status']} |" for name, step in report['steps'].items()]
              lines += ['', f"Synthetic tracks: **{report.get('track_count', 2)}**", f"Synthetic import: **{report.get('import_status', 'unknown')}**"]
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('\n'.join(lines) + '\n')
          PYTHON
      - name: Collect report, screenshots and synthetic library
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-music-probe-${{ runner.arch }}-${{ github.run_id }}
          path: data/macos-probe/
          retention-days: 3
          if-no-files-found: warn
