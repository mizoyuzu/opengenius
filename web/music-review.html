<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenGenius</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252824;background:#f8f9f6;color-scheme:light;--line:#e2e5de;--muted:#737a70;--accent:#38664a}*{box-sizing:border-box}body{margin:0;max-width:1280px;padding:40px 36px 60px;margin-inline:auto}button,input,select{font:inherit;color:inherit}button,select,input:not([type=checkbox]){border:1px solid var(--line);border-radius:7px;background:white;padding:9px 12px;font-size:13px}button{cursor:pointer;transition:background .15s}button:hover{background:#eff2eb}button.primary{color:white;background:var(--accent);border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}h1{margin:0;font-size:18px;letter-spacing:-.5px;font-weight:650}header,.tools,.pages{display:flex;gap:10px;align-items:center}header{justify-content:space-between;margin-bottom:34px}nav{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:26px}nav button{background:none;border:0;border-radius:0;padding:0 0 13px;color:var(--muted);font-size:14px}nav button[aria-selected=true]{color:#252824;border-bottom:2px solid var(--accent)}[hidden]{display:none!important}.tools{flex-wrap:wrap}.filters{gap:12px}.filters input{flex:1;min-width:180px}.filters select{max-width:290px}#notice{font-size:13px;color:var(--muted);white-space:pre-wrap;margin-top:-16px;margin-bottom:20px}#notice:empty{display:none}#notice.error{color:#a34038}.small{font-size:12px;color:var(--muted)}.selectionline{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}.quiet{border:0;background:transparent;padding:6px;color:var(--muted);font-size:12px}.tablewrap{overflow:auto;max-height:calc(100vh - 340px);min-height:200px}thead th{position:sticky;top:0;background:#f8f9f6;z-index:1}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}td,th{padding:13px 9px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{width:34px;padding-left:0}td.title{min-width:170px}td.album{min-width:180px;color:var(--muted)}td.artist{color:var(--muted)}button.track{border:0;background:none;padding:0;text-align:left;font-size:13px;line-height:1.5}button.track:hover{text-decoration:underline}.chip{display:inline-block;border-radius:4px;background:#edf1e9;padding:3px 6px;margin:2px;font-size:11px;white-space:nowrap}.pages{justify-content:flex-end;margin-top:16px}.pages button{padding:5px 10px}.editbar{padding:15px;margin:12px 0;background:#eef2e9;border-radius:9px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.editbar input{max-width:220px}.editbar select{max-width:140px}.editbar .divider{height:22px;width:1px;background:#d5ddce;margin:0 3px}.recommend-start{display:flex;gap:12px;align-items:center;max-width:680px}.recommend-start select{flex:1;min-width:0}.conditions{margin:20px 0 30px}.conditions summary{font-size:13px;color:var(--muted);cursor:pointer;width:fit-content}.conditions .tools{margin-top:14px}.conditions input{min-width:220px}.conditions label{display:grid;gap:7px;font-size:12px;color:var(--muted)}#resultStatus{margin:24px 0 10px}.result{margin:16px 0 28px}.result summary{font-size:15px;font-weight:550;cursor:pointer}.result p{font-size:12px;color:var(--muted);margin:10px 0}.result ol{padding-left:24px;margin-top:18px}.result li{font-size:13px;line-height:1.5;padding:8px 0;border-bottom:1px solid var(--line)}.result .artist{color:var(--muted);margin-left:10px}.indirect{font-size:10px;color:var(--muted);margin-left:8px}#comparison{border-top:1px solid var(--line);padding-top:20px;margin-top:32px}#comparison>summary{font-size:13px;cursor:pointer;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:12px;padding:26px;width:min(560px,90vw);max-height:80vh;color:inherit;background:#f8f9f6}dialog::backdrop{background:#222c243b}dialog header{margin-bottom:16px}dialog h2{font-size:16px;margin:0;font-weight:550}dialog pre{font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}@media(max-width:700px){body{padding:24px 18px}header{margin-bottom:28px}.filters select{max-width:100%;flex:1}.tablewrap{margin-right:-18px}.editbar .divider{display:none}.recommend-start{align-items:stretch}.conditions .tools>*{width:100%}.conditions select,.conditions input{width:100%}td,th{padding:12px 7px}}
</style>
<header><h1>OpenGenius</h1><button id="save" disabled>保存</button></header>
<div id="notice" role="status" aria-live="polite"></div>
<nav role="tablist" aria-label="表示"><button id="libraryTab" role="tab" aria-selected="true" aria-controls="libraryPanel">ライブラリ</button><button id="recommendTab" role="tab" aria-selected="false" aria-controls="recommendPanel">推薦</button></nav>
<section id="libraryPanel" role="tabpanel" aria-labelledby="libraryTab">
<div class="tools filters"><input id="search" type="search" aria-label="曲・歌手・アルバムを検索" placeholder="検索"><select id="album" aria-label="アルバム"><option value="">全アルバム</option></select><select id="filterKind" aria-label="種類で絞り込み"><option value="">すべての種類</option><option value="unknown">不明</option><option value="vocal">歌唱</option><option value="bgm">BGM</option><option value="off_vocal">Off Vocal</option></select></div>
<div class="selectionline"><span id="status" class="small"></span><div class="tools"><button id="selectFiltered" class="quiet">全選択</button><button id="clearSelection" class="quiet" hidden>解除</button></div></div>
<div id="editbar" class="editbar" hidden><span id="selection" class="small"></span><input id="editTags" aria-label="付けるタグ" placeholder="タグ（カンマ区切り）"><select id="tagMode" aria-label="タグの変更方法"><option value="add">追加</option><option value="replace">置き換え</option></select><button id="applyTags">タグを適用</button><span class="divider"></span><select id="editKind" aria-label="設定する種類"><option value="unknown">不明</option><option value="vocal">歌唱</option><option value="bgm">BGM</option><option value="off_vocal">Off Vocal</option></select><button id="applyKind">種類を適用</button><button id="reset" class="quiet" title="選択した曲の個別訂正を解除">訂正を解除</button></div>
<div class="tablewrap"><table><thead><tr><th><span aria-label="選択">✓</span></th><th>曲</th><th>歌手</th><th>アルバム</th><th>タグ</th><th>種類</th></tr></thead><tbody id="tracks"></tbody></table></div><div class="pages"><button id="prev" aria-label="前のページ">←</button><span id="page" class="small"></span><button id="next" aria-label="次のページ">→</button></div>
</section>
<section id="recommendPanel" role="tabpanel" aria-labelledby="recommendTab" hidden>
<div class="recommend-start"><select id="root" aria-label="起点"><option value="">すべての起点</option></select><button id="evaluate" class="primary">生成</button></div>
<details class="conditions"><summary>条件</summary><div class="tools"><label>タグ<input id="scopeTags" placeholder="カンマ区切り・すべて一致"></label><label>種類<select id="scopeKind"><option value="">すべて</option><option value="vocal">歌唱</option><option value="bgm">BGM</option><option value="off_vocal">Off Vocal</option><option value="unknown">不明</option></select></label><label>除外<select id="excludeKind"><option value="">なし</option><option value="off_vocal">Off Vocal</option></select></label><label>選曲<select id="profile"><option value="without-compatible-genre">標準</option><option value="artist-album-minimum-one">歌手・アルバムの連続を許容</option><option value="relations-only">関係のみ</option></select></label></div></details>
<div id="resultStatus" class="small" role="status"></div><div id="results"></div><details id="comparison" hidden><summary>前回の結果</summary><div id="previousResults"></div></details>
</section>
<dialog id="detail"><header><h2 id="detailTitle"></h2><button id="closeDetail" class="quiet" aria-label="閉じる">閉じる</button></header><pre id="evidence"></pre></dialog>
<script>
'use strict';
const token='__SESSION_TOKEN__';
const $=id=>document.getElementById(id), kinds={unknown:'不明',vocal:'歌唱',bgm:'BGM',off_vocal:'Off Vocal'}, profiles={'without-compatible-genre':'標準','artist-album-minimum-one':'歌手・アルバムの連続を許容','relations-only':'関係のみ'};
let state,selected=new Set(),page=0,dirty=false,busy=false,previousEvaluation=null;
const norm=s=>String(s||'').normalize('NFKC').toLocaleLowerCase();
const tags=s=>s.split(/[,、，]/).map(x=>x.trim()).filter(Boolean);
function notice(text,error=false){$('notice').textContent=text;$('notice').className=error?'error':'';}
async function api(path,data){const res=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(data)});const value=await res.json();if(!res.ok)throw new Error(value.error||'処理に失敗しました');return value;}
function element(tag,text){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;return node;}
function filtered(){const q=norm($('search').value),album=$('album').value,kind=$('filterKind').value;return state.tracks.filter(t=>(!album||t.album===album)&&(!kind||state.classifications[t.persistent_id].kind===kind)&&(!q||norm([t.title,t.artist,t.album].join(' ')).includes(q)));}
function selectionChanged(){$('selection').textContent=`${selected.size}曲`;$('editbar').hidden=!selected.size;$('clearSelection').hidden=!selected.size;}
function refresh(){const rows=filtered(),max=Math.max(0,Math.ceil(rows.length/100)-1);page=Math.min(page,max);$('status').textContent=rows.length===state.tracks.length?`${rows.length.toLocaleString()}曲`:`${rows.length.toLocaleString()} / ${state.tracks.length.toLocaleString()}曲`;$('save').textContent=dirty?'保存 •':'保存';$('save').className=dirty?'primary':'';$('save').disabled=busy||!dirty;selectionChanged();$('page').textContent=`${page+1} / ${max+1}`;$('prev').disabled=busy||page===0;$('next').disabled=busy||page===max;const body=$('tracks');body.replaceChildren();for(const track of rows.slice(page*100,(page+1)*100)){const pid=track.persistent_id,label=state.classifications[pid],tr=element('tr'),td=element('td'),check=element('input');check.type='checkbox';check.checked=selected.has(pid);check.disabled=busy;check.setAttribute('aria-label',`${track.title||'無題'}を選択`);check.onchange=()=>{check.checked?selected.add(pid):selected.delete(pid);selectionChanged();};td.append(check);tr.append(td);const title=element('td'),b=element('button',track.title||'無題');title.className='title';b.className='track';b.disabled=busy;b.onclick=()=>{$('detailTitle').textContent=track.title||'無題';$('evidence').textContent=JSON.stringify({曲:track.title,歌手:track.artist,アルバム:track.album,PID:pid,...label},null,2);$('detail').showModal();};title.append(b);const artist=element('td',track.artist||'');artist.className='artist';tr.append(title,artist);const a=element('td',track.album||'');a.className='album';tr.append(a);const ts=element('td');label.tags.forEach(t=>{const c=element('span',t);c.className='chip';ts.append(c);});tr.append(ts,element('td',kinds[label.kind]));body.append(tr);}}
function renderReport(report,box){box.replaceChildren();for(const row of report?.root_results||[]){const track=state.tracks.find(t=>t.persistent_id===row.root_pid),d=element('details');d.className='result';d.open=report.root_results.length===1;d.append(element('summary',`${track?.title||'起点'} · ${row.generated_count}曲`));d.append(element('p',`起点を含む · 候補 ${row.candidate_count}曲 · ${profiles[row.profile]||'選曲条件'}`));const list=element('ol');for(const item of row.playlist||[]){const li=element('li');li.append(element('span',item.title||'無題'));const artist=element('span',item.artist||'');artist.className='artist';li.append(artist);if(item.observed_relation_hops>1){const hint=element('span','間接');hint.className='indirect';li.append(hint);}list.append(li);}if(!row.generated_count)d.append(element('p','この範囲に候補がありません'));d.append(list);box.append(d);}}
function renderResults(){const report=state.evaluation;renderReport(report,$('results'));$('resultStatus').textContent=!report?'':report.cluster_config_sha256!==state.config_sha256?'分類の変更後、再生成が必要です':'';const roots=new Set((report?.root_results||[]).map(row=>row.root_pid));const previous=previousEvaluation?{...previousEvaluation,root_results:(previousEvaluation.root_results||[]).filter(row=>roots.has(row.root_pid))}:null;$('comparison').hidden=!previous?.root_results.length;if(previous)renderReport(previous,$('previousResults'));}
function setBusy(value){busy=value;document.querySelectorAll('button,input,select').forEach(n=>n.disabled=value);if(!value){$('evaluate').disabled=!state.evaluation_available;refresh();}}
async function edit(fields){if(!selected.size)return;setBusy(true);try{state=await api('/api/edit',{persistent_ids:[...selected],...fields});dirty=state.has_unsaved_changes;refresh();renderResults();notice(dirty?'未保存':'');}catch(e){notice(e.message,true);}finally{setBusy(false);}}
$('applyTags').onclick=()=>edit({tags:tags($('editTags').value),tag_mode:$('tagMode').value});$('applyKind').onclick=()=>edit({kind:$('editKind').value});$('reset').onclick=()=>edit({reset:true});
for(const id of ['search','album','filterKind'])$(id).oninput=()=>{page=0;refresh();};$('selectFiltered').onclick=()=>{filtered().forEach(t=>selected.add(t.persistent_id));refresh();};$('clearSelection').onclick=()=>{selected.clear();refresh();};$('prev').onclick=()=>{page--;refresh();};$('next').onclick=()=>{page++;refresh();};
function switchTab(recommend){$('libraryTab').setAttribute('aria-selected',String(!recommend));$('recommendTab').setAttribute('aria-selected',String(recommend));$('libraryPanel').hidden=recommend;$('recommendPanel').hidden=!recommend;}
$('libraryTab').onclick=()=>switchTab(false);$('recommendTab').onclick=()=>switchTab(true);$('closeDetail').onclick=()=>$('detail').close();$('detail').onclick=e=>{if(e.target===$('detail')){const r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail').close();}};
$('save').onclick=async()=>{setBusy(true);try{await api('/api/save',{});dirty=false;notice('保存しました');}catch(e){notice(e.message,true);}finally{setBusy(false);}};
$('evaluate').onclick=async()=>{setBusy(true);notice('生成中…');try{const res=await api('/api/evaluate',{tags:tags($('scopeTags').value),kind:$('scopeKind').value||null,excluded_kinds:$('excludeKind').value?[$('excludeKind').value]:[],profile:$('profile').value,root_pid:$('root').value||null});previousEvaluation=state.evaluation;state.evaluation=res.evaluation;$('comparison').open=false;renderResults();notice(dirty?'生成しました · 分類は未保存':'生成しました');}catch(e){notice(e.message,true);}finally{setBusy(false);}};
window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue='';}});
(async()=>{try{state=await api('/api/state');dirty=state.has_unsaved_changes;[...new Set(state.tracks.map(t=>t.album).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja')).forEach(a=>{const o=element('option',a);o.value=a;$('album').append(o);});for(const pid of state.available_root_pids||[]){const t=state.tracks.find(t=>t.persistent_id===pid),o=element('option',t?.title||'起点');o.value=pid;$('root').append(o);}$('evaluate').disabled=!state.evaluation_available;refresh();renderResults();if(!state.evaluation_available)notice('推薦の生成は利用できません');}catch(e){notice(e.message,true);}})();
</script>
</html>
